name: Feature request
description: Propose a new policy, option or integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current features do not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like, ideally as the annotation or API you would write. Check the FAQ's "not supported yet" list first.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other libraries or workarounds you have looked at.
