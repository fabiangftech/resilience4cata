# Version updates for the Gradle version catalog (gradle/libs.versions.toml), the Gradle wrapper and
# the GitHub Actions above (pinned to commit SHAs; Dependabot updates the SHA and the version comment).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # The project adopts a release only once it is at least two weeks old (CLAUDE.md).
    cooldown:
      default-days: 14
    ignore:
      # The oldest JUnit that resilience4cata-junit supports (junitMinimum, junitPlatformMinimum in
      # gradle/libs.versions.toml): the module compiles against it and minimumJUnitTest runs on it. The rest of
      # the build gets JUnit through the junit-bom entry, which these rules do not touch.
      - dependency-name: 'org.junit.jupiter:junit-jupiter-api'
      - dependency-name: 'org.junit.platform:junit-platform-testkit'
      # The oldest Spring Boot that resilience4cata-spring supports (springBootMinimum): its main code compiles
      # against these artifacts. Its tests get Spring Boot through the spring-boot-dependencies entry (springBoot),
      # which these rules do not touch.
      - dependency-name: 'org.springframework.boot:spring-boot-autoconfigure'
      - dependency-name: 'org.springframework.boot:spring-boot-health'
      - dependency-name: 'org.springframework.boot:spring-boot-actuator'
      - dependency-name: 'org.springframework.boot:spring-boot-actuator-autoconfigure'
      - dependency-name: 'org.springframework.boot:spring-boot-autoconfigure-processor'
      - dependency-name: 'org.springframework.boot:spring-boot-configuration-processor'
      - dependency-name: 'org.springframework:spring-tx'
      # The oldest Micronaut that resilience4cata-micronaut supports (micronautMinimum): its main code compiles
      # against these artifacts. Its tests get Micronaut through the micronaut-platform entry (micronautPlatform),
      # which these rules do not touch.
      - dependency-name: 'io.micronaut:micronaut-inject'
      - dependency-name: 'io.micronaut:micronaut-inject-java'
      - dependency-name: 'io.micronaut:micronaut-management'
      # The oldest Quarkus that resilience4cata-quarkus supports (quarkusMinimum): the extension's runtime and
      # deployment modules compile against these artifacts. Its tests get Quarkus through the quarkus-bom entry and
      # the io.quarkus plugin (quarkus), which these rules do not touch.
      - dependency-name: 'io.quarkus:quarkus-arc'
      - dependency-name: 'io.quarkus:quarkus-arc-deployment'
      - dependency-name: 'io.quarkus:quarkus-extension-processor'
      - dependency-name: 'org.eclipse.microprofile.health:microprofile-health-api'
    groups:
      junit:
        patterns: ['org.junit*']
      resilience4j:
        patterns: ['io.github.resilience4j:*']
      quarkus:
        patterns: ['io.quarkus*']
      openjdk-harnesses:
        patterns: ['org.openjdk.jmh:*', 'org.openjdk.jcstress:*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The project adopts a release only once it is at least two weeks old (CLAUDE.md).
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
