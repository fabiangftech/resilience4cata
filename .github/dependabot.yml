# Version updates for the Gradle version catalog (gradle/libs.versions.toml), the Gradle wrapper and
# the GitHub Actions above (pinned to commit SHAs; Dependabot updates the SHA and the version comment).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The oldest JUnit that resilience4cata-junit supports (junitMinimum, junitPlatformMinimum in
      # gradle/libs.versions.toml): the module compiles against it and minimumJUnitTest runs on it. The rest of
      # the build gets JUnit through the junit-bom entry, which these rules do not touch.
      - dependency-name: 'org.junit.jupiter:junit-jupiter-api'
      - dependency-name: 'org.junit.platform:junit-platform-testkit'
    groups:
      junit:
        patterns: ['org.junit*']
      resilience4j:
        patterns: ['io.github.resilience4j:*']
      openjdk-harnesses:
        patterns: ['org.openjdk.jmh:*', 'org.openjdk.jcstress:*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
