# Compile, test and javadoc every module on JDK 21 and 25, and check that code generated by the last release's
# processor runs on this build. Every step is one command you can run locally:
#   ./gradlew build -PtestJdk=<21|25>
#   ./gradlew :examples:check -Pr4c.generatedBy=baseline
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this workflow on the tagged commit before it builds the bundle.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches and PRs; keep one result per commit on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 is always needed: it is the compile toolchain (--release 21). JDK 25 is always needed too:
      # the micronaut module compiles and tests on it (--release 25), even with -PtestJdk=21. The matrix JDK
      # is listed last, so it becomes JAVA_HOME (Gradle itself runs on it) and runs the tests (-PtestJdk).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java == 21 && '25' || '21' }}
            ${{ matrix.java }}

      # Caches dependencies and Gradle's build cache (written on main only, read on PRs) and
      # validates the wrapper. The configuration cache is enabled in gradle.properties; it is saved
      # between runs only if the GRADLE_ENCRYPTION_KEY secret is set.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build
        run: >-
          ./gradlew build -PtestJdk=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  # docs/en/reference/compatibility.md#generated-code: code generated by processor 1.a runs on core 1.b for b >= a.
  # The examples' tests are compiled with the processor, annotations and modules of r4c.apiBaseline (the last
  # release) from Maven Central, then run on this build's modules.
  generated-code:
    name: generated code (last release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check generated code of the last release
        run: >-
          ./gradlew :examples:check -Pr4c.generatedBy=baseline
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-generated-code
          path: |
            examples/build/reports/tests/
            examples/build/test-results/
          retention-days: 14
