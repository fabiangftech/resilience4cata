# Builds GraalVM native images of four applications and runs their tests inside them:
# - quarkus: the Quarkus guide's application (quarkus:it), with the @QuarkusIntegrationTest classes against the image:
#   the annotated class, the interface and REST client wrappers, health, metrics, and the Mono and Flux beans
#   (src/integrationTest). The same tests run against the jar with ./gradlew :quarkus:it:quarkusIntTest.
# - spring and micronaut: small applications (native:spring, native:micronaut) whose JUnit tests run inside the image
#   through GraalVM Native Build Tools (nativeTest): an annotated class, a wrapped interface, YAML configuration,
#   health, metrics and the resilience4cata endpoint over HTTP, and Mono and Flux methods of both styles served by
#   the framework (the scenarios of the Quarkus ReactiveSmokeIT). The same tests run on the JVM in `check`.
# - java: a plain Java application with no framework (native:java): a wrapped interface and annotated classes created
#   through Resilient.of/create, configuration from resilience4cata.properties, every policy, CompletableFuture, Mono
#   and Flux methods and a Pipeline, so only the library's own metadata makes it work. Its tests run on the JVM in
#   `check` and inside the image (nativeTest).
# - footprint: the spring and micronaut images and the same applications without resilience4cata (native:*-plain),
#   started in turn; startup time and RSS go to the job summary (native:footprint). A report, not a gate.
# Locally (GraalVM for JDK 25 in GRAALVM_HOME):
#   ./gradlew :quarkus:it:testNative -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false \
#     -Dquarkus.native.graalvm-home=<GraalVM>
#   ./gradlew :native:spring:nativeTest :native:micronaut:nativeTest :native:java:nativeTest
#   ./gradlew :native:footprint:footprint     # report in native/footprint/build/footprint/report.md
#
# Not on every PR: a native build takes several minutes. It runs on PRs that touch what ends up in the image, after
# every merge to main and nightly.
name: native

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'core/**'
      - 'processor/**'
      - 'config/**'
      - 'reactor/**'
      - 'micrometer/**'
      - 'quarkus/**'
      - 'spring/**'
      - 'micronaut/**'
      - 'native/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/native.yml'
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 is the compile toolchain (--release 21).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # GraalVM for JDK 25 builds the image; it becomes JAVA_HOME (Gradle runs on it) and sets GRAALVM_HOME.
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: graalvm-community

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Native image tests
        run: >-
          ./gradlew :quarkus:it:testNative
          -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.graalvm-home="$GRAALVM_HOME"
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-reports
          path: |
            quarkus/it/build/reports/tests/
            quarkus/it/build/test-results/
          retention-days: 14

  native-spring:
    name: native (spring)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 is the compile toolchain (--release 21).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # GraalVM for JDK 25 builds the image; it becomes JAVA_HOME (Gradle runs on it) and sets GRAALVM_HOME.
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: graalvm-community

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Native image tests
        run: ./gradlew :native:spring:nativeTest -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-spring-test-reports
          path: native/spring/build/test-results/
          retention-days: 14

  native-micronaut:
    name: native (micronaut)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 is the compile toolchain of the library's modules (--release 21); the application itself is on 25.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # GraalVM for JDK 25 builds the image; it becomes JAVA_HOME (Gradle runs on it) and sets GRAALVM_HOME.
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: graalvm-community

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Native image tests
        run: ./gradlew :native:micronaut:nativeTest -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-micronaut-test-reports
          path: native/micronaut/build/test-results/
          retention-days: 14

  native-java:
    name: native (java)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 is the compile toolchain (--release 21).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # GraalVM for JDK 25 builds the image; it becomes JAVA_HOME (Gradle runs on it) and sets GRAALVM_HOME.
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: graalvm-community

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Native image tests
        run: ./gradlew :native:java:nativeTest -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-java-test-reports
          path: native/java/build/test-results/
          retention-days: 14

  footprint:
    name: native (footprint)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 21 is the compile toolchain of the library's modules (--release 21).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # GraalVM for JDK 25 builds the images; it becomes JAVA_HOME (Gradle runs on it) and sets GRAALVM_HOME.
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: graalvm-community

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Measure
        run: ./gradlew :native:footprint:footprint -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Summary
        if: always()
        run: |
          if [ -f native/footprint/build/footprint/report.md ]; then
            cat native/footprint/build/footprint/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-footprint-logs
          path: native/footprint/build/footprint/
          retention-days: 14
