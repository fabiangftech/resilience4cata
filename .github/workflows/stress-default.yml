# jcstress tests of the lock-free policies in default mode, on x86 and on ARM: more forks and longer runs than the
# quick mode of stress.yml. ARM is where weakened orderings can show (x86 is TSO); x86 is where TimeoutStress hung in
# default mode while quick mode passed (each state's watchdog filled the thread's ThreadLocalMap), so both run.
# Locally: ./gradlew :stress:jcstress
#
# Weekly and by hand: a GitHub runner has 4 cores, so a run takes a few hours. Its own workflow, so a push to main
# (which restarts stress.yml) does not cancel it.
name: stress-default

on:
  schedule:
    - cron: '41 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jcstress:
    name: jcstress default (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: jcstress
        env:
          JDK: JAVA_HOME_21_${{ matrix.arch == 'arm64' && 'AARCH64' || 'X64' }}
        run: ./gradlew :stress:jcstress -Pjcstress="-m default" "-Porg.gradle.java.installations.fromEnv=$JDK"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jcstress-report-default-${{ matrix.arch }}
          path: stress/build/jcstress/results/
          if-no-files-found: ignore
          retention-days: 30
