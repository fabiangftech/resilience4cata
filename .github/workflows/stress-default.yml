# jcstress tests of the lock-free policies in default mode, on x86 and on ARM: more forks and longer runs than the
# quick mode of stress.yml. ARM is where weakened orderings can show (x86 is TSO); x86 is where TimeoutStress hung in
# default mode while quick mode passed (each state's watchdog filled the thread's ThreadLocalMap), so both run.
# Locally: ./gradlew :stress:jcstress
#
# Weekly and by hand: a GitHub runner has 4 cores, so a run takes hours. On x86 jcstress tries more than twice as many
# thread and core layouts as on ARM, and the whole suite needs about 8 h there, past GitHub's 6 h per job: the tests
# run in three shards of 22 (by class), and the last shard takes every class the first two do not name, so a new
# test class always runs. Its own workflow, so a push to main (which restarts stress.yml) does not cancel it.
name: stress-default

on:
  schedule:
    - cron: '41 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jcstress:
    name: jcstress default (${{ matrix.arch }}, ${{ matrix.shard.name }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        shard:
          - name: 1 of 3
            tests: '\.(Cancellation|Bulkhead|Timeout|Hedge)Stress\.'
          - name: 2 of 3
            tests: '\.(CircuitBreaker|CircuitBreakerHalfOpen|CircuitBreakerQuiet|FluxCall|BulkheadWaiters|AdaptiveLimit)Stress\.'
          - name: 3 of 3
            tests: '^(?!.*\.(Cancellation|Bulkhead|Timeout|Hedge|CircuitBreaker|CircuitBreakerHalfOpen|CircuitBreakerQuiet|FluxCall|BulkheadWaiters|AdaptiveLimit)Stress\.)'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: jcstress
        env:
          JDK: JAVA_HOME_21_${{ matrix.arch == 'arm64' && 'AARCH64' || 'X64' }}
          TESTS: ${{ matrix.shard.tests }}
        run: ./gradlew :stress:jcstress "-Pjcstress=-m default -t $TESTS" "-Porg.gradle.java.installations.fromEnv=$JDK"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jcstress-report-default-${{ matrix.arch }}-${{ strategy.job-index }}
          path: stress/build/jcstress/results/
          if-no-files-found: ignore
          retention-days: 30
