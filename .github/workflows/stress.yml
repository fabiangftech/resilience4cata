# jcstress tests of the lock-free policies, quick mode.
# Locally: ./gradlew :stress:jcstress -Pjcstress="-m quick"
#
# Not run on every PR: it takes several minutes of all-core load, and its value comes from many
# repetitions on varied hardware, not from one run per PR. A race it finds is rarely one the PR's
# diff makes obvious, so running after every merge to main and nightly gives the same coverage
# without slowing reviews. Run it by hand (workflow_dispatch) on a PR that touches a lock-free policy.
name: stress

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jcstress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: jcstress
        run: >-
          ./gradlew :stress:jcstress -Pjcstress="-m quick"
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jcstress-report
          path: stress/build/jcstress/results/
          if-no-files-found: ignore
          retention-days: 30
