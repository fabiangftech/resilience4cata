# Allocation gate: ./gradlew :benchmark:allocationCheck
#
# Bytes allocated per operation (JMH -prof gc, gc.alloc.rate.norm) that each benchmark may not reach:
# a benchmark passes if it allocates less than its budget + 1 B/op. Format:
#
#   <BenchmarkClass>.<method> = <budget in B/op>
#
# Adding a benchmark to the gate is one line here. Sync success and rejection paths (no event
# listeners) must stay at 0. Async paths allocate their futures; their budgets are the measured
# values (see docs/en/benchmarks.md): raise one only for an allocation that is intended and documented.

# Retry
RetryBenchmark.resilience4cataSuccess = 0
RetryBenchmark.resilience4cataRetryOnce = 0
MultiTypeRetryBenchmark.resilience4cataSuccess = 0
# Retry budget: success counts the call in a stripe; a granted retry allocates nothing either (the
# window's marks are replaced at most once per tenth of budgetWindow, far below 1 B/op)
RetryBudgetBenchmark.resilience4cataBudgetSuccess = 0
RetryBudgetBenchmark.resilience4cataBudgetRetryOnce = 0

# Circuit breaker: count and time windows, rejection while open
CircuitBreakerBenchmark.resilience4cataSuccess = 0
CircuitBreakerBenchmark.resilience4cataMixed = 0
CircuitBreakerBenchmark.resilience4cataTimeSuccess = 0
CircuitBreakerBenchmark.resilience4cataOpen = 0

# Rate limiter: permit available, rejection
RateLimiterBenchmark.resilience4cataFree = 0
RateLimiterBenchmark.resilience4cataExhausted = 0

# Bulkhead: free slot, rejection, semaphore (waiting) mode
BulkheadBenchmark.resilience4cataFree = 0
BulkheadBenchmark.resilience4cataFull = 0
BulkheadBenchmark.resilience4cataWaiting = 0

# Adaptive limit: success (two clock reads, a sample in this thread's stripe; a window ends every second
# and allocates nothing without listeners), rejection; async on a completed stage returns one LinkedFuture
AdaptiveLimitBenchmark.resilience4cata = 0
AdaptiveLimitBenchmark.resilience4cataFull = 0
AdaptiveLimitBenchmark.resilience4cataAsync = 24

# Timeout (sync, caller's thread)
TimeoutBenchmark.resilience4cata = 0

# Classifiers
ClassifierBenchmark.resilience4cataClassified = 0
ClassifierBenchmark.resilience4cataRetriedAndClassified = 0

# Generated code vs programmatic Pipeline
PipelineBenchmark.generatedRetryCircuitBreaker = 0
PipelineBenchmark.pipelineRetryCircuitBreaker = 0
PipelineBenchmark.pipelineRunRetryCircuitBreaker = 0
PipelineBenchmark.generatedFour = 0
PipelineBenchmark.pipelineFour = 0
PipelineBenchmark.generatedAll = 0
PipelineBenchmark.pipelineAll = 0
PipelineBenchmark.generatedCapturing = 0
PipelineBenchmark.pipelineCapturing = 0

# Subclass style vs interface wrapper
SubclassBenchmark.subclassSuccess = 0
SubclassBenchmark.wrapperSuccess = 0
SubclassBenchmark.subclassRetryOnce = 0
SubclassBenchmark.wrapperRetryOnce = 0

# Async: each layer returns a new future (48 B for the retry). A stage that is already complete is recorded at
# once by the circuit breaker, bulkhead, rate limiter and adaptive limit, and skips the timeout's timer: only a
# completed copy (24 B; 48 B before 0.11.0, measured on AWS Graviton3 and Apple M1, 2026-10-29); a pending one
# is scheduled and cancelled. The stack nests retry, circuit breaker, timeout and bulkhead (200 -> 152 B). The pending-stage timeout also shares the timer thread's work (inbox drains,
# lane links) across calls, so its bytes per call vary by a few bytes around 192 between runs: its
# budget leaves 8 B of slack, still less than one extra object per call (16 B).
AsyncBenchmark.resilience4cataRetry = 48
AsyncBenchmark.resilience4cataCircuitBreaker = 24
AsyncBenchmark.resilience4cataBulkhead = 24
AsyncBenchmark.resilience4cataRateLimiter = 24
AsyncBenchmark.resilience4cataTimeout = 24
AsyncBenchmark.resilience4cataTimeoutPending = 200
AsyncBenchmark.resilience4cataStack = 152

# Hedge (async only). An already completed first attempt needs no delay: the attempt lambda (16 B,
# captures the wrapper) and the completed copy (24 B), as for the timeout's shortcut. A pending first
# attempt that wins before the delay: the benchmark's own stage (24 B), the attempt lambda (24 B, it
# also captures the argument), the call's HedgeCall (80 B: it is the delay's timer entry, the attempt's
# callback and the future's link), the returned LinkedFuture (24 B), and whenComplete's callback node and
# dependent future (40 + 24 B): measured 216 B with ThreadMXBean on JDK 21 (Apple M1), every round.
# The delay is pushed onto and cancelled in the shared timer's inbox, which allocates nothing; 8 B of
# slack as for the pending timeout, still less than one object per call. The budget's per-call count
# allocates nothing (NoBudget measures the same bytes).
HedgeBenchmark.resilience4cata = 40
HedgeBenchmark.resilience4cataPending = 224
HedgeBenchmark.resilience4cataNoBudget = 224

# Mono methods (resilience4cata-reactor). Every benchmark includes subscribing to the result with a lambda
# (ReactorBenchmark.baseline: 88 B). On top of that, one policy around a constant Mono (Mono.just: its value is
# read without subscribing) costs the method's Mono and its lambda, the subscription that delivers the value, the
# call lambda, the policy's future and the constant's completed future: 112 B; a timeout skips its timer for a
# value that is already there (88 B). A pending source subscribes a StageSubscriber and waits on every layer.
# These short-lived objects are scalar-replaced by the JIT in some forks and not in others: on AWS Graviton3
# (2026-10-27) the same benchmark measured 200 B in one fork and 224, 240 or 280 B in another (one object more or
# less, per JIT decision), so each budget is the highest fork measured there or on Apple M1, not the typical value.
ReactorBenchmark.resilience4cataRetry = 280
ReactorBenchmark.resilience4cataCircuitBreaker = 240
ReactorBenchmark.resilience4cataBulkhead = 224
ReactorBenchmark.resilience4cataRateLimiter = 216
ReactorBenchmark.resilience4cataTimeout = 176
ReactorBenchmark.resilience4cataStack = 424
ReactorBenchmark.resilience4cataPipelineStack = 504
ReactorBenchmark.resilience4cataTimeoutPending = 504
ReactorBenchmark.resilience4cataStackPending = 920

# Flux methods (resilience4cata-reactor). Every benchmark includes subscribing to the result with a lambda and its
# ten (or a thousand) elements (FluxBenchmark.baseline: 96 B). On top of that, a call allocates the method's Flux and
# its lambda, the FluxCall (the subscriber's subscription), the attempt and its subscriber (a CompletableFuture), the
# layers' lambdas and, per policy, a completed copy for a stream that ended during its subscription (the circuit
# breaker, bulkhead and rate limiter: 192 B), or its future and callback when the stream is pending; elements
# allocate nothing (*Long). Each budget is the highest fork measured on AWS Graviton3 (2026-10-29), Apple M1 or the CI
# runner (x86), as for the Mono methods: the circuit breaker and bulkhead measured 288 B on Graviton3 and 320 B on M1,
# the rate limiter 288 B on both and 344 B on the CI runner (one object the JIT does not scalar-replace there). The
# pending timeout also shares the timer thread's work across calls, like AsyncBenchmark's: its iterations measured
# 1656-1671 B on the CI runner, so its budget leaves 24 B of slack, less than one extra object per call.
FluxBenchmark.resilience4cataCircuitBreaker = 320
FluxBenchmark.resilience4cataBulkhead = 320
FluxBenchmark.resilience4cataRateLimiter = 344
FluxBenchmark.resilience4cataRetry = 392
FluxBenchmark.resilience4cataTimeout = 384
FluxBenchmark.resilience4cataStack = 616
FluxBenchmark.resilience4cataPipelineStack = 752
FluxBenchmark.resilience4cataTimeoutPending = 1680
FluxBenchmark.resilience4cataStackPending = 2240
FluxBenchmark.resilience4cataTimeoutLong = 392
FluxBenchmark.resilience4cataStackLong = 624
