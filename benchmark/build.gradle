plugins {
    id 'r4c.jmh'
}

description = 'JMH benchmarks against Resilience4j (and Netflix concurrency-limits for the adaptive limit). Not published.'

dependencies {
    implementation project(':core')
    compileOnly project(':annotations')
    annotationProcessor project(':processor')
    implementation libs.resilience4j.retry
    implementation libs.resilience4j.circuitbreaker
    implementation libs.resilience4j.timelimiter
    implementation libs.resilience4j.bulkhead
    implementation libs.resilience4j.ratelimiter
    implementation libs.resilience4j.hedge
    implementation libs.concurrency.limits.core
    // ReactorBenchmark: Mono methods against Resilience4j's Reactor operators, on the latest Reactor.
    implementation project(':reactor')
    implementation platform(libs.reactor.bom)
    implementation libs.reactor.core
    implementation libs.resilience4j.reactor
}
