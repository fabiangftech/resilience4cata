# Resilience4j's instances, with the settings of CataCalls's annotations (MicronautBenchmark's Javadoc).
resilience4j.retry.enabled=true
resilience4j.retry.instances.retry.max-attempts=3
resilience4j.retry.instances.retry.wait-duration=0ms
resilience4j.retry.instances.stack.max-attempts=3
resilience4j.retry.instances.stack.wait-duration=0ms
resilience4j.circuitbreaker.enabled=true
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=100
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=100
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.default.writable-stack-trace-enabled=false
resilience4j.circuitbreaker.instances.breaker.base-config=default
resilience4j.circuitbreaker.instances.open.base-config=default
resilience4j.circuitbreaker.instances.stack.base-config=default
resilience4j.bulkhead.enabled=true
# Without it @Bulkhead does nothing: its interceptor requires the thread-pool bulkhead registry bean too.
resilience4j.thread-pool-bulkhead.enabled=true
resilience4j.bulkhead.instances.bulkhead.max-concurrent-calls=1000
resilience4j.bulkhead.instances.bulkhead.max-wait-duration=0ms
resilience4j.bulkhead.instances.stack.max-concurrent-calls=1000
resilience4j.bulkhead.instances.stack.max-wait-duration=0ms
resilience4j.ratelimiter.enabled=true
resilience4j.ratelimiter.instances.limiter.limit-for-period=1000000000
resilience4j.ratelimiter.instances.limiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.limiter.timeout-duration=0ms
resilience4j.ratelimiter.instances.stack.limit-for-period=1000000000
resilience4j.ratelimiter.instances.stack.limit-refresh-period=1s
resilience4j.ratelimiter.instances.stack.timeout-duration=0ms
resilience4j.timelimiter.enabled=true
resilience4j.timelimiter.instances.timeout.timeout-duration=1s
