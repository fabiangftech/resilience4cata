# One jar with everything, so that JMH (and its forks) can run the augmented application from a plain class path.
quarkus.package.jar.type=uber-jar
quarkus.banner.enabled=false
quarkus.log.level=WARN
# JMH looks the beans up by type, so nothing injects them: keep them.
quarkus.arc.remove-unused-beans=none
