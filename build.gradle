plugins {
    // centralBundle / centralUpload: see docs/en/releasing.md
    id 'r4c.central'
    // SonarCloud analysis (the official SonarSource plugin, the one exception to "no third-party Gradle plugins"):
    //   ./gradlew build -Pcoverage :examples:testCodeCoverageReport sonar --no-configuration-cache
    // needs SONAR_TOKEN in the environment; CI runs it in .github/workflows/sonar.yml.
    id 'org.sonarqube' version '7.5.0.8588'
}

sonar {
    properties {
        property 'sonar.projectKey', 'fabiangftech_resilience4cata'
        property 'sonar.organization', 'fabiangftech'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${rootDir}/examples/build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"
        // Annotation types are declarations only: nothing in them runs.
        property 'sonar.coverage.exclusions', '**/dev/resilience4cata/annotation/**'
        // Only the library is analysed: test code is not. Coverage still counts every test, through the JaCoCo
        // report above.
        property 'sonar.test.exclusions', '**/*'
    }
}

// Only the published modules are analysed. Benchmarks, jcstress tests, examples, the site generator and the Quarkus
// extension's test application are harnesses, not library code.
subprojects {
    afterEvaluate {
        if (!pluginManager.hasPlugin('r4c.publish')) {
            sonar { skipProject = true }
        }
    }
}
