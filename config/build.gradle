plugins {
    id 'r4c.java-library'
    id 'r4c.publish'
}

description = 'External configuration (properties, environment, system properties) for the registry.'

dependencies {
    api project(':core')
}

tasks.named('test') {
    // ErrorCodeTest checks the error codes against the error reference pages.
    inputs.files('../docs/en/errors.md', '../docs/es/errors.md').withPropertyName('errorPages').withPathSensitivity(PathSensitivity.RELATIVE)
    // ConfigurationReferenceTest checks the configuration key reference against the code.
    inputs.files('../docs/en/reference/configuration.md', '../docs/es/reference/configuration.md')
            .withPropertyName('configurationReference').withPathSensitivity(PathSensitivity.RELATIVE)
}

// ContractTest compares the code with the repository's contract directory (docs/en/reference/compatibility.md).
tasks.named('test') {
    inputs.dir("$rootDir/contract").withPropertyName('contract').withPathSensitivity(PathSensitivity.RELATIVE)
}

// ConfigFuzzTest: -PfuzzSeed=<n> replays one seed, -PfuzzCount=<n> runs that many seeds from -PfuzzStart=<n>
// (the nightly fuzz workflow starts at a new seed).
tasks.named('test') {
    systemProperty 'test.fuzz.start', providers.gradleProperty('fuzzStart').getOrElse('1')
    systemProperty 'test.seed', providers.gradleProperty('fuzzSeed').getOrElse('')
    systemProperty 'test.fuzz.count', providers.gradleProperty('fuzzCount').getOrElse('1000')
}
