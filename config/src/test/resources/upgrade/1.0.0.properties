# A configuration written for resilience4cata 1.0.0: every key that release knows, in the forms its documentation
# shows. UpgradeTest checks that this release reads it without problems (resolved from Maven Central) and that the
# current code reads it without problems or warnings, to the same values. Never edit it to make the test pass: a key
# or value this file uses must keep working in every 1.x release (docs/en/reference/compatibility.md). When
# r4c.apiBaseline moves to a new release, add that release's file next to this one.

# Every attribute of every policy, in the defaults.
resilience4cata.defaults.retry.enabled=true
resilience4cata.defaults.retry.maxAttempts=4
resilience4cata.defaults.retry.delay=150ms
resilience4cata.defaults.retry.backoff=exponential
resilience4cata.defaults.retry.multiplier=1.5
resilience4cata.defaults.retry.maxDelay=PT2S
resilience4cata.defaults.retry.jitter=equal
resilience4cata.defaults.retry.maxDuration=10s
resilience4cata.defaults.retry.retryOn=java.io.IOException, java.util.concurrent.TimeoutException
resilience4cata.defaults.retry.abortOn=java.io.FileNotFoundException
resilience4cata.defaults.retry.budgetPercent=20
resilience4cata.defaults.retry.budgetMinRetriesPerSecond=5
resilience4cata.defaults.retry.budgetWindow=10s

resilience4cata.defaults.hedge.enabled=true
resilience4cata.defaults.hedge.delay=50ms
resilience4cata.defaults.hedge.maxAttempts=3
resilience4cata.defaults.hedge.hedgeOn=java.io.IOException
resilience4cata.defaults.hedge.abortOn=java.lang.IllegalArgumentException
resilience4cata.defaults.hedge.budgetPercent=10.5
resilience4cata.defaults.hedge.budgetMinHedgesPerSecond=5
resilience4cata.defaults.hedge.budgetWindow=PT10S

resilience4cata.defaults.circuitBreaker.enabled=true
resilience4cata.defaults.circuitBreaker.failureRateThreshold=40
resilience4cata.defaults.circuitBreaker.slowCallRateThreshold=80.5
resilience4cata.defaults.circuitBreaker.slowCallDuration=2s
resilience4cata.defaults.circuitBreaker.windowType=count
resilience4cata.defaults.circuitBreaker.windowSize=50
resilience4cata.defaults.circuitBreaker.windowDuration=30s
resilience4cata.defaults.circuitBreaker.minimumCalls=20
resilience4cata.defaults.circuitBreaker.waitInOpen=15s
resilience4cata.defaults.circuitBreaker.halfOpenCalls=5
resilience4cata.defaults.circuitBreaker.maxWaitInHalfOpen=30s
resilience4cata.defaults.circuitBreaker.recordOn=java.io.IOException,java.lang.IllegalStateException
resilience4cata.defaults.circuitBreaker.ignoreOn=java.lang.IllegalArgumentException

resilience4cata.defaults.rateLimiter.enabled=true
resilience4cata.defaults.rateLimiter.permits=100
resilience4cata.defaults.rateLimiter.period=1s
resilience4cata.defaults.rateLimiter.maxWait=0

resilience4cata.defaults.adaptiveLimit.enabled=true
resilience4cata.defaults.adaptiveLimit.algorithm=aimd
resilience4cata.defaults.adaptiveLimit.minLimit=2
resilience4cata.defaults.adaptiveLimit.initialLimit=10
resilience4cata.defaults.adaptiveLimit.maxLimit=100
resilience4cata.defaults.adaptiveLimit.window=1s
resilience4cata.defaults.adaptiveLimit.minWindowSamples=5
resilience4cata.defaults.adaptiveLimit.smoothing=0.3
resilience4cata.defaults.adaptiveLimit.rttTolerance=1.5
resilience4cata.defaults.adaptiveLimit.longWindow=300
resilience4cata.defaults.adaptiveLimit.queueSize=4
resilience4cata.defaults.adaptiveLimit.backoffRatio=0.8
resilience4cata.defaults.adaptiveLimit.dropOn=java.util.concurrent.TimeoutException
resilience4cata.defaults.adaptiveLimit.ignoreOn=java.lang.IllegalArgumentException

resilience4cata.defaults.timeout.enabled=true
resilience4cata.defaults.timeout.value=2s

resilience4cata.defaults.bulkhead.enabled=true
resilience4cata.defaults.bulkhead.maxConcurrent=20
resilience4cata.defaults.bulkhead.maxWait=100ms

# Named configs: kebab case, other value forms, the short prefix, and extends.
resilience4cata.configs.slow.retry.max-attempts=6
resilience4cata.configs.slow.retry.delay=PT0.5S
resilience4cata.configs.slow.retry.backoff=FIXED
resilience4cata.configs.slow.retry.jitter=none
resilience4cata.configs.slow.timeout.value=5s
resilience4cata.configs.slow.circuit-breaker.window-type=TIME
resilience4cata.configs.slow.circuit-breaker.window-duration=60s
resilience4cata.configs.slow.adaptive-limit.algorithm=gradient2
r4c.configs.slow.bulkhead.max-concurrent=8
r4c.configs.slow.rate-limiter.permits=10
resilience4cata.configs.slow.hedge.enabled=false
resilience4cata.configs.slower.extends=slow
resilience4cata.configs.slower.timeout.value=10s
resilience4cata.configs.slower.retry.jitter=full

# Instances: a policy's name, and a generated id (quoted, it has characters outside [A-Za-z0-9_-]).
resilience4cata.instances.inventory.retry.max-attempts=3
resilience4cata.instances.inventory.circuit-breaker.failure-rate-threshold=60
resilience4cata.instances."com.acme.Prices#price(String)".bulkhead.max-concurrent=5
resilience4cata.instances."com.acme.Prices#price(String)".timeout.enabled=false

# A profile, active.
resilience4cata.profiles.active=staging
resilience4cata.profiles.staging.defaults.timeout.value=3s
resilience4cata.profiles.staging.configs.slow.retry.max-attempts=2
