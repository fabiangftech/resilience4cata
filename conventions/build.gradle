plugins {
    id 'java-gradle-plugin'
}

gradlePlugin {
    plugins {
        javaLibrary {
            id = 'r4c.java-library'
            implementationClass = 'dev.resilience4cata.build.JavaLibraryConventionPlugin'
        }
        jmh {
            id = 'r4c.jmh'
            implementationClass = 'dev.resilience4cata.build.JmhConventionPlugin'
        }
        publish {
            id = 'r4c.publish'
            implementationClass = 'dev.resilience4cata.build.PublishConventionPlugin'
        }
        central {
            id = 'r4c.central'
            implementationClass = 'dev.resilience4cata.build.CentralConventionPlugin'
        }
        quarkusExtension {
            id = 'r4c.quarkus-extension'
            implementationClass = 'dev.resilience4cata.build.QuarkusExtensionConventionPlugin'
        }
        jcstress {
            id = 'r4c.jcstress'
            implementationClass = 'dev.resilience4cata.build.JcstressConventionPlugin'
        }
    }
}
