plugins {
    id 'r4c.java-library'
    id 'r4c.publish'
}

description = 'Resilience policies, registry and the runtime used by generated code.'

dependencies {
    api libs.jspecify
    // @Internal and @Experimental only (CLASS retention): read by the API compatibility check, never at run time.
    compileOnly project(':annotations')
}

tasks.named('test') {
    // ErrorCodeTest checks the error codes against the error reference pages.
    inputs.files('../docs/en/errors.md', '../docs/es/errors.md').withPropertyName('errorPages').withPathSensitivity(PathSensitivity.RELATIVE)
    // The seeded model tests (*ModelTest) replay one seed with -Ptest.seed=<n>.
    def seed = providers.gradleProperty('test.seed')
    if (seed.present) {
        systemProperty 'test.seed', seed.get()
    }
}
