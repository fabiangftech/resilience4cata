# GraalVM Native Image options for resilience4cata-core, read automatically from the class path.
# The holders below start the library's background threads (the timeout watchdog, the async timeout
# timer and the async delay timer) when they are initialized, so they must be initialized at run time,
# never in the image heap. They are lazy: nothing starts unless a policy that needs them is created.
# NativeImagePropertiesTest checks that every class listed here exists.
Args = --initialize-at-run-time=dev.resilience4cata.generated.Watchdog$Shared,dev.resilience4cata.generated.TimeoutTimer$Shared,dev.resilience4cata.generated.AsyncSupport$Timer
