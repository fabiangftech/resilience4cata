plugins {
    id 'r4c.java-library'
    // One coverage report over every module, for SonarCloud: much of core is only exercised end to end here.
    id 'jacoco-report-aggregation'
}

description = 'Runnable examples. Not published: their tests check the generated code end to end.'

dependencies {
    testImplementation project(':core')
    testImplementation project(':testkit')
    testImplementation project(':junit')
    testImplementation project(':config')
    // docs/en/guides/opentelemetry.md: the module, an SDK, and the Prometheus exporter it shows.
    testImplementation project(':opentelemetry')
    testImplementation libs.opentelemetry.sdk
    testImplementation libs.opentelemetry.sdk.testing
    testImplementation libs.opentelemetry.exporter.prometheus
    testImplementation project(':micrometer')
    // Only for the sample scrape in docs/en/guides/micrometer.md.
    testImplementation libs.micrometer.registry.prometheus
    // Mono methods (MonoEndToEndTest and the other Mono* tests), on the latest Reactor.
    testImplementation project(':reactor')
    testImplementation platform(libs.reactor.bom)
    testImplementation libs.reactor.test
    testImplementation libs.reactive.streams.tck
    testImplementation libs.blockhound
    testCompileOnly project(':annotations')
    testAnnotationProcessor project(':processor')
}

// DocsTest reads the documentation site and checks its snippets against the examples, and against the Spring and
// Micronaut modules' tests and quarkus/it for their guides (that code needs the framework, which the examples do not
// depend on).
tasks.named('test') {
    inputs.dir('../docs').withPropertyName('docs').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('../spring/src/test').withPropertyName('springSnippets').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('../micronaut/src/test').withPropertyName('micronautSnippets').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('../quarkus/it/src').withPropertyName('quarkusSnippets').withPathSensitivity(PathSensitivity.RELATIVE)
}

// The modules whose own tests and sources join the aggregated report (testCodeCoverageReport, with -Pcoverage).
dependencies {
    jacocoAggregation project(':annotations')
    jacocoAggregation project(':core')
    jacocoAggregation project(':processor')
    jacocoAggregation project(':config')
    jacocoAggregation project(':testkit')
    jacocoAggregation project(':junit')
    jacocoAggregation project(':micrometer')
    jacocoAggregation project(':opentelemetry')
    jacocoAggregation project(':reactor')
}

// BlockHound instruments the JVM for good (and needs a JVM flag to do so on Java 21+), so its test runs alone, in a
// JVM of its own; `test` leaves it out.
tasks.named('test') {
    exclude '**/*BlockHoundTest.class'
}

def blockHoundTest = tasks.register('blockHoundTest', Test) {
    description = 'Runs the BlockHound test: no policy blocks a non-blocking Reactor thread.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*BlockHoundTest.class'
    jvmArgs '-XX:+AllowRedefinitionToAddDeleteMethods'
}

tasks.named('check') {
    dependsOn blockHoundTest
}
