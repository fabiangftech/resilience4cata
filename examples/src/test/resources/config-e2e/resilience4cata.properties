# Used by ConfigEndToEndTest: retunes ConfigTunedClient without recompiling it.
defaults.retry.jitter=none
defaults.retry.delay=1ms

# A named config defined in code too: these values win over the code's, attribute by attribute.
configs.external.retry.maxAttempts=4

# Per-instance overrides beat the annotation values.
instances."dev.resilience4cata.examples.ConfigTunedClient#quote(java.lang.String)".retry.max-attempts=5
instances.config-shipping.circuit-breaker.minimum-calls=2
instances.config-shipping.circuit-breaker.window-size=2

profiles.no-retry.instances."dev.resilience4cata.examples.ConfigTunedClient#quote(java.lang.String)".retry.enabled=false
