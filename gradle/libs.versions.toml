[versions]
junit = "6.1.3"
# The oldest JUnit the junit module supports: its main code compiles against it, and its tests also run on it.
# Never bump these two with the rest of JUnit: .github/dependabot.yml ignores their artifacts.
junitMinimum = "5.10.5"
junitPlatformMinimum = "1.10.5"
assertj = "3.27.7"
jspecify = "1.0.1"
jmh = "1.37"
jcstress = "0.16"
resilience4j = "2.4.0"
# api of the micrometer module; the Prometheus registry is test-only (examples), for the sample scrape in the docs.
micrometer = "1.17.2"
# The opentelemetry module: the API is an api dependency, the SDK is test-only.
opentelemetry = "1.67.0"
# Test-only, in examples: the Prometheus exporter of docs/en/guides/opentelemetry.md (published only as -alpha).
opentelemetry-prometheus = "1.67.0-alpha"
# The spring module compiles against the oldest supported Spring Boot (springBootMinimum: never bump it with the rest,
# .github/dependabot.yml ignores the artifacts that use it) and its tests run on springBoot, through Boot's BOM.
springBoot = "4.1.1"
springBootMinimum = "4.1.0"
# The Spring Framework of springBootMinimum, for the spring module's compile-only spring-tx (same Dependabot rule).
springFrameworkMinimum = "7.0.8"
# Compile-only in the spring module: javac reads Jackson annotations on Spring Boot's health classes.
jacksonAnnotations = "2.21"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-testkit = { module = "org.junit.platform:junit-platform-testkit" }
junit-jupiter-api-minimum = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitMinimum" }
junit-platform-testkit-minimum = { module = "org.junit.platform:junit-platform-testkit", version.ref = "junitPlatformMinimum" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jcstress-core = { module = "org.openjdk.jcstress:jcstress-core", version.ref = "jcstress" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-timelimiter = { module = "io.github.resilience4j:resilience4j-timelimiter", version.ref = "resilience4j" }
resilience4j-bulkhead = { module = "io.github.resilience4j:resilience4j-bulkhead", version.ref = "resilience4j" }
resilience4j-ratelimiter = { module = "io.github.resilience4j:resilience4j-ratelimiter", version.ref = "resilience4j" }
resilience4j-hedge = { module = "io.github.resilience4j:resilience4j-hedge", version.ref = "resilience4j" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
opentelemetry-exporter-prometheus = { module = "io.opentelemetry:opentelemetry-exporter-prometheus", version.ref = "opentelemetry-prometheus" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
# The spring module's main code, at the oldest supported Spring Boot.
spring-boot-autoconfigure-minimum = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBootMinimum" }
spring-boot-health-minimum = { module = "org.springframework.boot:spring-boot-health", version.ref = "springBootMinimum" }
spring-boot-actuator-minimum = { module = "org.springframework.boot:spring-boot-actuator", version.ref = "springBootMinimum" }
spring-boot-actuator-autoconfigure-minimum = { module = "org.springframework.boot:spring-boot-actuator-autoconfigure", version.ref = "springBootMinimum" }
spring-boot-autoconfigure-processor-minimum = { module = "org.springframework.boot:spring-boot-autoconfigure-processor", version.ref = "springBootMinimum" }
spring-boot-configuration-processor-minimum = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBootMinimum" }
spring-tx-minimum = { module = "org.springframework:spring-tx", version.ref = "springFrameworkMinimum" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jacksonAnnotations" }
# The spring module's tests: versions from spring-boot-dependencies.
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-health = { module = "org.springframework.boot:spring-boot-health" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-actuator" }
spring-boot-actuator-autoconfigure = { module = "org.springframework.boot:spring-boot-actuator-autoconfigure" }
spring-boot-micrometer-metrics = { module = "org.springframework.boot:spring-boot-micrometer-metrics" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-test = { module = "org.springframework:spring-test" }
spring-tx = { module = "org.springframework:spring-tx" }
jakarta-transaction-api = { module = "jakarta.transaction:jakarta.transaction-api" }
spring-core-test = { module = "org.springframework:spring-core-test" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
snakeyaml = { module = "org.yaml:snakeyaml" }
