plugins {
    id 'r4c.java-library'
}

group = 'dev.resilience4cata.nativeimage'

description = 'Measures the startup time and memory of the native shop images with and without resilience4cata. Not published.'

// The images, each built by its project's nativeCompile (GraalVM in GRAALVM_HOME) into its directory; a name ending
// with -plain is the baseline of the one without the suffix.
def images = ['spring', 'spring-plain', 'micronaut', 'micronaut-plain']

// ./gradlew :native:footprint:footprint [-Pfootprint.runs=10]: report in native/footprint/build/footprint/report.md.
// Not in check: it builds four native images.
tasks.register('footprint', JavaExec) {
    description = 'Starts the native shop images with and without resilience4cata and reports startup time and RSS.'
    group = 'verification'
    images.each { dependsOn(":native:${it}:nativeCompile") }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.resilience4cata.nativeimage.footprint.Footprint'
    def report = layout.buildDirectory.file('footprint/report.md')
    def runs = providers.gradleProperty('footprint.runs').orElse('10')
    def nativeDir = rootProject.layout.projectDirectory.dir('native')
    argumentProviders.add({
        [report.get().asFile.path, runs.get()] + images.collect {
            "${it}=${nativeDir.dir("${it}/build/native/nativeCompile").asFile.path}".toString()
        }
    } as CommandLineArgumentProvider)
    outputs.file(report)
    outputs.upToDateWhen { false }
}
