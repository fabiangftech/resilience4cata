# Read by ResilienceConfig.load() from the classpath. In a native image it is there without Native Build Tools'
# resource autodetection (off in build.gradle): Native Image registers a resource looked up by a constant name.
# The application's exception class is registered for reflection by this project's reachability-metadata.json, as
# the configuration guide says; a JDK class is named too, registered by nobody.
r4c.configs.inventory.retry.maxAttempts=4
r4c.configs.inventory.retry.retryOn=dev.resilience4cata.nativeimage.plainjava.OutOfStockException
r4c.configs.inventory.retry.abortOn=java.lang.IllegalArgumentException
