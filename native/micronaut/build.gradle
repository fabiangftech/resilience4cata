plugins {
    id 'r4c.java-library'
    id 'application'
    // The official GraalVM Native Build Tools plugin: this project only tests the library in a native image (CLAUDE.md:
    // third-party plugins are excluded from the library's build, not from its test projects). Not Micronaut's own
    // application plugin: from 5.0 it needs Gradle on Java 25, and the build runs on any JDK from 17.
    alias(libs.plugins.graalvm.native)
}

// Its own group: with the root's, Gradle would take this project and :micronaut for the same module.
group = 'dev.resilience4cata.nativeimage'

description = 'A Micronaut application with resilience4cata, tested on the JVM (test) and as a GraalVM native image (nativeTest). Not published.'

// Micronaut 5 needs Java 25, as the micronaut module.
r4cJava.release = 25

application {
    mainClass = 'dev.resilience4cata.nativeimage.micronaut.NativeShop'
}

dependencies {
    implementation platform(libs.micronaut.platform)
    implementation project(':micronaut')
    implementation project(':micrometer')
    // Mono and Flux methods (reactive package): the reactor module, on the platform's Reactor.
    implementation project(':reactor')
    implementation libs.micronaut.inject
    implementation libs.micronaut.http.server.netty
    implementation libs.micronaut.management
    implementation libs.micronaut.micrometer.core
    implementation libs.micronaut.serde.jackson
    runtimeOnly libs.snakeyaml
    runtimeOnly libs.logback.classic
    compileOnly project(':annotations')
    // Micronaut's processors (bean definitions, serde, and micronaut-graal: the native-image configuration of the
    // beans, which Micronaut's application plugin would add), and ours.
    annotationProcessor platform(libs.micronaut.platform)
    annotationProcessor libs.micronaut.inject.java
    annotationProcessor libs.micronaut.serde.processor
    annotationProcessor libs.micronaut.graal
    annotationProcessor project(':processor')

    testImplementation platform(libs.micronaut.platform)
    testImplementation libs.micronaut.test.junit5
    testCompileOnly project(':annotations')
    testAnnotationProcessor platform(libs.micronaut.platform)
    testAnnotationProcessor libs.micronaut.inject.java
    testAnnotationProcessor project(':processor')
}

tasks.withType(JavaCompile).configureEach {
    // Micronaut's classes carry annotations of jars it does not ship, as in the micronaut module; the generated
    // subclasses carry the class's bean annotations (-Ar4c.inject=micronaut), as the Micronaut guide recommends.
    options.compilerArgs.addAll(['-Xlint:-classfile', '-Ar4c.inject=micronaut'])
}

graalvmNative {
    // GraalVM is GRAALVM_HOME (CI: graalvm/setup-graalvm), not a Gradle toolchain.
    toolchainDetection = false
    // Reachability metadata of the libraries (Netty, Jackson...) from GraalVM's repository.
    metadataRepository {
        enabled = true
    }
    // An application: Native Build Tools would build the main binary as a shared library, since r4c.java-library
    // applies the java-library plugin (nativeTest always builds an executable).
    binaries.main {
        sharedLibrary = false
    }
    binaries.all {
        // application.yml and logback.xml, as Micronaut's application plugin would include them.
        resources.autodetect()
        // Netty 4.2 on Java 25 frees direct memory by closing a shared Arena (CleanerJava25); without this option the
        // image throws UnsupportedFeatureError on the event loop when a pooled chunk is freed, cutting a response off
        // after its headers (seen as a chunked-encoding EOF in the footprint job's load, 2026-11-22).
        buildArgs.add('-H:+SharedArenaSupport')
    }
}

// Native Build Tools gives each project its own metadata service, and each extracts the same repository zip into
// ~/.gradle/native-build-tools on first use. In parallel the extractions race, and a half-extracted directory fails
// every later build that finds it (CI caches that directory). One project after the other, the first extracts it and
// the others reuse it.
tasks.named('collectReachabilityMetadata') {
    mustRunAfter ':native:spring-plain:collectReachabilityMetadata'
}
