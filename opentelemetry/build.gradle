plugins {
    id 'r4c.java-library'
    id 'r4c.publish'
}

description = 'OpenTelemetry metrics for resilience4cata: counters from events, gauges from snapshots.'

dependencies {
    api project(':core')
    // Compiled against the oldest supported OpenTelemetry API; the application's own, newer API wins at resolution.
    api libs.opentelemetry.api.minimum

    // `test` runs on the latest OpenTelemetry, through its BOM.
    testImplementation platform(libs.opentelemetry.bom)
    testImplementation libs.opentelemetry.sdk
    testImplementation libs.opentelemetry.sdk.testing
    testImplementation project(':testkit')
}

// `test` runs on the latest OpenTelemetry; `minimumOpenTelemetryTest` runs the same tests on the oldest supported API
// and the SDK of that version.
testing {
    suites {
        minimumOpenTelemetryTest(JvmTestSuite) {
            sources {
                java {
                    srcDirs = ['src/test/java']
                }
            }
            dependencies {
                implementation project()
                implementation project(':testkit')
                // Explicit versions, no OpenTelemetry BOM.
                implementation libs.opentelemetry.sdk.minimum
                implementation libs.opentelemetry.sdk.testing.minimum
                implementation libs.assertj
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.minimumOpenTelemetryTest
}

// The instrumentation scope version: the build's version, written into a resource.
def moduleVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('moduleVersion', moduleVersion)
    filesMatching('**/version.properties') {
        expand(version: moduleVersion)
    }
}
