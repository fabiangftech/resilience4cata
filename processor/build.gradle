plugins {
    id 'r4c.java-library'
    id 'r4c.publish'
}

description = 'Annotation processor: validates resilience annotations and generates the wrapper classes.'

dependencies {
    implementation project(':annotations')
    testImplementation project(':core')
    // Mono methods: the generated code calls resilience4cata-reactor (and through it reactor-core).
    testImplementation project(':reactor')
}

tasks.named('test') {
    // ErrorCodeTest checks the error codes against the error reference pages.
    inputs.files('../docs/en/errors.md', '../docs/es/errors.md').withPropertyName('errorPages').withPathSensitivity(PathSensitivity.RELATIVE)
    // ProcessorFuzzTest: -PfuzzSeed=<n> replays one seed, -PfuzzCount=<n> runs that many seeds
    systemProperty 'test.seed', providers.gradleProperty('fuzzSeed').getOrElse('')
    systemProperty 'test.fuzz.count', providers.gradleProperty('fuzzCount').getOrElse('400')
}
