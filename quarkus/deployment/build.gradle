plugins {
    id 'r4c.java-library'
    id 'r4c.publish'
    id 'r4c.quarkus-extension'
}

description = 'Quarkus extension (deployment): the build steps of resilience4cata-quarkus. Applications never depend on it directly.'

dependencies {
    api project(':quarkus:runtime')
    api libs.quarkus.arc.deployment.minimum
    // The Dev UI card (ResilienceDevUiProcessor), dev mode only.
    implementation libs.quarkus.devui.deployment.spi.minimum
    // The build-step list (META-INF/quarkus-build-steps.list) and config metadata.
    annotationProcessor libs.quarkus.extension.processor.minimum
}

tasks.named('jar') {
    // Quarkus is not modular: an automatic module, named like the other resilience4cata modules.
    manifest.attributes('Automatic-Module-Name': 'dev.resilience4cata.quarkus.deployment')
}
