pluginManagement {
    includeBuild 'conventions'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'resilience4cata'

include 'annotations', 'core', 'processor', 'config', 'all', 'testkit', 'micrometer', 'opentelemetry', 'reactor', 'junit', 'spring', 'micronaut',
        // The Quarkus extension: runtime (resilience4cata-quarkus) and deployment (resilience4cata-quarkus-deployment),
        // as Quarkus requires; it is the one module split in nested projects. Its tests are in the unpublished
        // quarkus:it, the only project that applies the Quarkus Gradle plugin.
        'quarkus:runtime', 'quarkus:deployment', 'quarkus:it',
        'bom', 'examples', 'benchmark', 'stress', 'site',
        // The same benchmarks inside each framework, against Resilience4j's integration or the framework's own.
        'benchmark:spring', 'benchmark:micronaut', 'benchmark:quarkus'
