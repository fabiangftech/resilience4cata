pluginManagement {
    includeBuild 'conventions'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'resilience4cata'

include 'annotations', 'core', 'processor', 'config', 'testkit', 'micrometer', 'opentelemetry', 'junit', 'bom', 'examples', 'benchmark', 'stress'
