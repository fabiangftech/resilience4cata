plugins {
    id 'r4c.java-library'
    id 'r4c.publish'
}

description = 'Spring Boot 4 auto-configuration: the registry from application properties, generated classes as beans, metrics, health and an actuator endpoint.'

// The test libraries, shared by `test` and `minimumSpringBootTest`, which differ only in Boot's BOM.
def springTestLibraries = [
        libs.spring.boot.autoconfigure,
        libs.spring.boot.health,
        libs.spring.boot.actuator,
        libs.spring.boot.actuator.autoconfigure,
        libs.spring.boot.micrometer.metrics,
        libs.spring.boot.test,
        libs.spring.test,
        libs.spring.tx,
        libs.jakarta.transaction.api,
        libs.spring.core.test,
        libs.jackson.databind,
        libs.snakeyaml,
        libs.mockito.core,
        project(':micrometer'),
        project(':testkit'),
        project(':reactor'),
        libs.spring.boot.webflux,
        libs.spring.boot.reactor.netty,
        libs.spring.boot.webmvc,
        libs.spring.boot.tomcat,
        // DevToolsRestartTest: DevTools' RestartClassLoader, as a restart creates it.
        libs.spring.boot.devtools,
        libs.aspectjweaver,
        libs.hibernate.validator,
        libs.tomcat.embed.el,
        libs.reactor.test
]

dependencies {
    api project(':core')
    api project(':config')
    // Compiled against the oldest supported Spring Boot (explicit versions, no BOM: the build's BOM is the latest);
    // the application's own, newer Boot wins at resolution.
    api libs.spring.boot.autoconfigure.minimum
    // Optional integrations, each behind @ConditionalOnClass: the application brings them if it wants them.
    compileOnly project(':micrometer')
    compileOnly libs.spring.boot.health.minimum
    compileOnly libs.spring.boot.actuator.minimum
    compileOnly libs.spring.boot.actuator.autoconfigure.minimum
    compileOnly libs.spring.tx.minimum
    // Mockito's spies (@MockitoSpyBean) are left unwrapped; read only when Mockito is on the class path (tests).
    compileOnly libs.mockito.core.minimum
    // Annotations on Boot's health classes, read by javac.
    compileOnly libs.jackson.annotations
    // Condition metadata (spring-autoconfigure-metadata.properties) and configuration metadata for the IDEs.
    annotationProcessor libs.spring.boot.autoconfigure.processor.minimum
    annotationProcessor libs.spring.boot.configuration.processor.minimum

    // Tests run on the latest Spring Boot, through its BOM; minimumSpringBootTest runs them on the oldest supported one.
    testImplementation platform(libs.spring.boot.dependencies)
    springTestLibraries.each { testImplementation it }
    testCompileOnly project(':annotations')
    testAnnotationProcessor project(':processor')
}

tasks.named('compileJava') {
    // The configuration processor merges META-INF/additional-spring-configuration-metadata.json from the resources.
    inputs.files(tasks.named('processResources')).withPropertyName('resources').withPathSensitivity(PathSensitivity.RELATIVE)
    // It takes the descriptions from the Javadoc of the sources it compiles: an incremental compile would drop them.
    options.incremental = false
    // Spring reads parameter names at run time: the actuator endpoint's @Selector parameter needs its name.
    options.compilerArgs.add('-parameters')
}

tasks.named('compileTestJava') {
    // As Spring Boot's Gradle plugin does: Spring matches constructor parameters by name.
    options.compilerArgs.add('-parameters')
}

// `test` runs on the latest Spring Boot; `minimumSpringBootTest` compiles and runs the same tests with every version
// that Boot's BOM manages forced to the oldest supported Boot's (enforcedPlatform beats the latest BOM), as in an
// application on that Boot.
testing {
    suites {
        minimumSpringBootTest(JvmTestSuite) {
            sources {
                java {
                    srcDirs = ['src/test/java']
                }
                resources {
                    srcDirs = ['src/test/resources']
                }
            }
            dependencies {
                implementation project()
                // Boot's own minimum versions, also for the libraries it manages (Reactor, Jackson, Mockito...).
                implementation enforcedPlatform(libs.spring.boot.dependencies.minimum)
                implementation libs.assertj
            }
        }
    }
}

configurations {
    minimumSpringBootTestCompileOnly.extendsFrom testCompileOnly
    minimumSpringBootTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

dependencies {
    springTestLibraries.each { minimumSpringBootTestImplementation it }
}

tasks.named('compileMinimumSpringBootTestJava') {
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    // ErrorCodeTest checks the error codes against the error reference pages.
    inputs.files('../docs/en/errors.md', '../docs/es/errors.md').withPropertyName('errorPages').withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named('check') {
    dependsOn testing.suites.minimumSpringBootTest
}
