plugins {
    id 'r4c.jcstress'
}

description = 'jcstress and Lincheck tests of the lock-free policies. Not published.'

dependencies {
    implementation project(':core')
    implementation project(':reactor')
    // OpenTelemetryMetricsStress: the module on a real SDK with an in-memory reader.
    implementation project(':opentelemetry')
    implementation platform(libs.opentelemetry.bom)
    implementation libs.opentelemetry.sdk
    implementation libs.opentelemetry.sdk.testing
}

dependencies {
    // Lincheck (src/test): written in Kotlin, a test-only library here; the tests are Java.
    testImplementation libs.lincheck
}

tasks.named('test') {
    // Lincheck attaches its instrumentation agent at run time.
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    def iterations = providers.gradleProperty('lincheck.iterations')
    if (iterations.present) {
        systemProperty 'lincheck.iterations', iterations.get()
    }
}
