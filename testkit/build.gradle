plugins {
    id 'r4c.java-library'
    id 'r4c.publish'
}

description = 'Test support: a manual clock for retries, breakers, rate limiters and timeouts, and seeded jitter.'

dependencies {
    api project(':core')
}

// ErrorCodeTest reads the error reference pages.
tasks.named('test') {
    inputs.files('../docs/en/errors.md', '../docs/es/errors.md').withPropertyName('errorPages').withPathSensitivity(PathSensitivity.RELATIVE)
}
